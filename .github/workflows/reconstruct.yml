name: reconstruct-public
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public GitHub owner/repo
        required: true
        type: string
      ref:
        description: Optional git ref
        required: false
        type: string
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: graft-plus reconstruct --repo "${{ inputs.repo }}" ${{ inputs.ref && format('--ref {0}', inputs.ref) || '' }} --out artifacts/graft-pack
      - uses: actions/upload-artifact@v4
        with:
          name: graft-pack
          path: artifacts/graft-pack
