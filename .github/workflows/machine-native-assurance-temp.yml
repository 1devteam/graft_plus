          assert decision['grants_execution_authority'] is False
          print(json.dumps({
              'nodes': complete['node_count'],
              'edges': complete['edge_count'],
              'identity_integrity_pass': complete['identity_integrity_pass'],
              'disposition': decision['decision']['architecture_disposition'],
              'dimensions': decision['decision']['dimensions'],
          }, indent=2))
          PY
