name: Machine-native G.R.A.F.T. assurance upgrade
on:
  push:
    branches:
      - feat/machine-native-assurance-20261005
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machine-native-assurance-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply derived system transformation
        run: python tools/apply_machine_native_assurance.py
      - name: Validate repository and reconstructed self-model
        run: |
          python -m pip install -e '.[dev]'
          pytest
          rm -rf /tmp/graft-self
          graft-plus reconstruct --repo-path . --out /tmp/graft-self
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('/tmp/graft-self')
          complete = json.loads((out / 'graph-completeness-report.json').read_text())
          decision = json.loads((out / 'graph-architecture-decision.json').read_text())
          assert complete['identity_integrity_pass'] is True
          assert complete['identity_collision_count'] == 0
          assert 'dimensions' in decision['decision']
          assert decision['decision']['merge_authorization'] == 'not-determined'
          assert decision['grants_execution_authority'] is False
          print(json.dumps({'nodes': complete['node_count'], 'edges': complete['edge_count'], 'disposition': decision['decision']['architecture_disposition'], 'dimensions': decision['decision']['dimensions']}, indent=2))
          PY
      - name: Commit coherent upgrade
        run: |
          git config user.name '1devteam'
          git config user.email 'inmo.ai@outlook.com'
          git add src/graft_plus/semantic.py src/graft_plus/completeness.py src/graft_plus/decision.py tests/test_machine_native_assurance.py tests/test_reconstruct.py docs/ASSURANCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: make reconstruction assurance machine-native'
          git push origin HEAD:feat/machine-native-assurance-20261005
