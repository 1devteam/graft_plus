name: Machine-native G.R.A.F.T. assurance upgrade
on:
  push:
    branches:
      - feat/machine-native-assurance-20261005
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machine-native-assurance-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validate and commit coherent upgrade
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: run machine-native assurance upgrade" ]; then
            echo "not an upgrade trigger; exiting cleanly"
            exit 0
          fi
          python tools/apply_machine_native_assurance.py
          python tools/fix_machine_native_compat.py
          python -m pip install -e '.[dev]'
          pytest
          rm -rf /tmp/graft-self
          python -c "from pathlib import Path; from graft_plus.cli import reconstruct; raise SystemExit(reconstruct(Path('.'), Path('/tmp/graft-self'), None, None, None))"
          python -c "import json; from pathlib import Path; out=Path('/tmp/graft-self'); c=json.loads((out/'graph-completeness-report.json').read_text()); d=json.loads((out/'graph-architecture-decision.json').read_text()); assert c['identity_integrity_pass'] is True; assert c['identity_collision_count'] == 0; assert 'dimensions' in d['decision']; assert d['decision']['merge_authorization'] == 'not-determined'; assert d['grants_execution_authority'] is False; print(json.dumps({'nodes':c['node_count'],'edges':c['edge_count'],'disposition':d['decision']['architecture_disposition'],'dimensions':d['decision']['dimensions']}, indent=2))"
          git config user.name '1devteam'
          git config user.email 'inmo.ai@outlook.com'
          git add src/graft_plus/semantic.py src/graft_plus/completeness.py src/graft_plus/decision.py tests/test_machine_native_assurance.py tests/test_reconstruct.py docs/ASSURANCE.md
          git commit -m 'feat: make reconstruction assurance machine-native'
          git push origin HEAD:feat/machine-native-assurance-20261005
