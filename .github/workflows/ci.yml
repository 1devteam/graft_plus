name: graft-plus
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: graft-plus reconstruct --subject . --out artifacts/graft-pack
      - name: Temporary ASCII token benchmark
        run: |
          pip install --disable-pip-version-check tiktoken
          python - <<'PY'
          from pathlib import Path
          import tiktoken
          enc = tiktoken.get_encoding("o200k_base")
          base = Path("artifacts/graft-pack")
          for name in ("dependency-graph.ascii.v1.txt", "dependency-graph.v1.json"):
              data = (base / name).read_text(encoding="utf-8")
              print(f"TOKEN_BENCH {name} bytes={len(data.encode())} tokens={len(enc.encode(data))}")
          PY
