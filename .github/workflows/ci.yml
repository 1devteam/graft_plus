name: graft-plus
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: graft-plus reconstruct --subject . --out artifacts/graft-pack
